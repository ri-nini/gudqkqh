<!-- =========================================================
Firebase (Firestore) SDK
- 리뷰를 영구 저장하려면 아래 FIREBASE_CONFIG 값을 본인의
Firebase 프로젝트 값으로 교체하세요.
- Firebase 콘솔 > 프로젝트 설정 > 일반 > 내 앱 에서 확인 가능합니다.
========================================================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getFirestore, collection, addDoc, onSnapshot,
query, orderBy, serverTimestamp, limit, doc, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ---------------------------------------------------------
// ★★★ 본인의 Firebase 프로젝트 설정값 ★★★
// ---------------------------------------------------------
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDT6ygTuHDcCjxVFHPGPik1lLBEyqMYskU",
  authDomain: "gudqkqh-82b97.firebaseapp.com",
  projectId: "gudqkqh-82b97",
  storageBucket: "gudqkqh-82b97.firebasestorage.app",
  messagingSenderId: "654493379891",
  appId: "1:654493379891:web:f88bb393924de0c0872246",
  measurementId: "G-VSQB3J8ZBJ"
};

const isFirebaseConfigured = FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY";

window.__firebase = { isFirebaseConfigured };

if (isFirebaseConfigured) {
const app = initializeApp(FIREBASE_CONFIG);
const db = getFirestore(app);
const reviewsCol = collection(db, "reviews");

window.__firebase.addReview = async (review) => {
await addDoc(reviewsCol, { ...review, createdAt: serverTimestamp() });
};

window.__firebase.deleteReview = async (id) => {
await deleteDoc(doc(db, "reviews", id));
};

window.__firebase.subscribe = (callback) => {
const q = query(reviewsCol, orderBy("createdAt", "desc"), limit(200));
return onSnapshot(q, (snap) => {
const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
callback(list);
}, (err) => {
console.error("Firestore 구독 오류:", err);
});
};
}

// 메인 스크립트에 초기화가 끝났음을 알림
window.dispatchEvent(new Event("firebase-ready"));
</script>

},

// 처음에 보여줄 기본 리뷰 (Firebase에 아직 저장된 리뷰가 하나도 없을 때만 표시됨)
seedReviews: [
{

}
],

homePreviewCount: 2, // 홈 화면에 미리 보여줄 리뷰 개수

// 관리자 모드 진입 비밀번호 (원하는 값으로 바꿔서 사용하세요)
adminPassword: "0625"

/* =================================================================
렌더링 로직 (아래는 수정하지 않아도 됩니다)
================================================================= */
// 처음엔 기본 예시 리뷰로 시작 → Firebase가 연결되면 실제 저장된 리뷰로 교체됨
let reviews = [...STORE.seedReviews];
let selectedStars = 0;
let selectedTags = new Set();
let usingFirebase = false;
let firestoreLoaded = false; // Firestore에서 최초 데이터를 한 번이라도 받았는지
let isAdmin = false;

function initials(name){ return (name || "?").replace(/\*/g,'').slice(0,1).toUpperCase() || "?"; }
function starString(n){ n = n || 5; return "★".repeat(n) + "☆".repeat(5-n); }

function renderStaticText(){
document.title = STORE.name + " - 리뷰";
document.getElementById('storeName').textContent = STORE.name;
document.getElementById('storeCategory').textContent = STORE.category;
document.getElementById('storeAddress').textContent = STORE.address;
document.getElementById('storeAddressSub').textContent = STORE.addressSub;
document.getElementById('storeHours').textContent = STORE.hours;
document.getElementById('storePhone').textContent = STORE.phone;
document.getElementById('storeWebsite').textContent = STORE.website;
document.getElementById('storeWebsite').href = STORE.website;
document.getElementById('newsTitle').textContent = STORE.newsTitle;
document.getElementById('newsText').textContent = STORE.newsText;
document.getElementById('kwParticipants').textContent = STORE.keywordStats.participants;
document.getElementById('kwPeople').textContent = STORE.keywordStats.people;

// menu
document.getElementById('menuList').innerHTML = STORE.menu.map(m => `
<div class="menu-item">
<div>
<div class="m-name">${m.name}</div>
${m.desc ? `<div class="m-desc">${m.desc}</div>` : ""}
</div>
<div class="m-price">${m.price}</div>
</div>
`).join('');

// tag picker options
document.getElementById('tagPick').innerHTML = STORE.reviewTags.map(t => `
<div class="chip" data-tag="${t}">${t}</div>
`).join('');

// keyword bars
const max = Math.max(...STORE.keywordStats.items.map(k => k.count));
document.getElementById('keywordList').innerHTML = STORE.keywordStats.items.map(k => `
<div class="kw-row">
<div class="fill" style="width:${(k.count/max*100).toFixed(0)}%"></div>
<span class="label">${k.emoji} "${k.label}"</span>
<span class="count">${k.count}</span>
</div>
`).join('');
}

function renderCarousel(){
const track = document.getElementById('carouselTrack');
const dots = document.getElementById('carouselDots');
track.innerHTML = STORE.photos.map(url => `<img src="${url}" alt="">`).join('');
dots.innerHTML = STORE.photos.map((_, i) => `<span class="${i===0?'active':''}"></span>`).join('');
document.getElementById('carouselCount').textContent = `1/${STORE.photos.length}`;

track.addEventListener('scroll', () => {
const idx = Math.round(track.scrollLeft / track.clientWidth);
[...dots.children].forEach((d,i) => d.classList.toggle('active', i===idx));
document.getElementById('carouselCount').textContent = `${idx+1}/${STORE.photos.length}`;
});
}

function reviewCardHTML(r, opts){
opts = opts || {};
const showDelete = opts.showDelete && isAdmin;
return `
<div class="review-card">
<div class="review-head">
<div class="avatar">${initials(r.name)}</div>
<div class="review-user">
<div class="name">${r.name}</div>
<div class="sub">${r.meta || ""}</div>
</div>
</div>
<div class="stars">${starString(r.rating)}</div>
${r.visit ? `<div class="visit-line">${r.visit}</div>` : ""}
<div class="review-text">${r.text}</div>
<div class="review-tags">${(r.tags||[]).map(t => `<div class="chip">${t}</div>`).join('')}</div>
<div class="review-footer">
<span>${r.dateLabel || ""}</span>
${showDelete ? `<button class="delete-btn" data-review-id="${r.id || ''}">🗑 삭제</button>` : ""}
</div>
</div>
`;
}

function renderReviews(){
const list = reviews;

document.getElementById('totalReviewCount').textContent = list.length.toLocaleString();
document.getElementById('homeReviewCount').textContent = list.length.toLocaleString();
document.getElementById('allReviewCount').textContent = list.length.toLocaleString();

// 홈 미리보기 (삭제 버튼 없음)
const preview = list.slice(0, STORE.homePreviewCount);
document.getElementById('homeReviewPreview').innerHTML = preview.length
? preview.map(r => reviewCardHTML(r, { showDelete: false })).join('')
: `<div class="empty-state">아직 등록된 리뷰가 없어요.</div>`;

// 전체 리스트 (리뷰 탭) - 관리자 모드일 때 삭제 버튼 표시
document.getElementById('allReviewList').innerHTML = list.length
? list.map(r => reviewCardHTML(r, { showDelete: true })).join('')
: `<div class="empty-state">아직 등록된 리뷰가 없어요.<br>첫 리뷰를 남겨보세요!</div>`;
}

/* 관리자 모드 진입/해제 */
document.getElementById('adminToggle').addEventListener('click', () => {
if(isAdmin){
isAdmin = false;
document.getElementById('adminToggle').classList.remove('on');
document.getElementById('adminToggle').textContent = "관리자 모드";
renderReviews();
return;
}
const input = prompt("관리자 비밀번호를 입력하세요.");
if(input === null) return;
if(input === STORE.adminPassword){
isAdmin = true;
document.getElementById('adminToggle').classList.add('on');
document.getElementById('adminToggle').textContent = "관리자 모드 (끄기)";
renderReviews();
} else {
alert("비밀번호가 올바르지 않습니다.");
}
});

/* 리뷰 삭제 (이벤트 위임) */
document.getElementById('allReviewList').addEventListener('click', async (e) => {
const btn = e.target.closest('.delete-btn');
if(!btn) return;
const id = btn.dataset.reviewId;

if(!id){
alert("이 리뷰는 코드에 직접 적힌 예시 리뷰라서 여기서 삭제할 수 없어요.\n삭제하려면 STORE.seedReviews 항목을 코드에서 직접 지워주세요.");
return;
}
if(!usingFirebase){
alert("Firebase가 연결되지 않아 이 리뷰는 서버에 저장되어 있지 않아요.");
return;
}
if(!confirm("이 리뷰를 정말 삭제할까요? 삭제하면 되돌릴 수 없어요.")) return;

btn.disabled = true;
btn.textContent = "삭제 중...";
try{
await window.__firebase.deleteReview(id);
// onSnapshot 구독이 자동으로 목록을 갱신합니다.
} catch(err){
console.error("리뷰 삭제 오류:", err);
alert("삭제 중 문제가 발생했어요. 콘솔에서 오류를 확인해주세요.");
btn.disabled = false;
btn.textContent = "🗑 삭제";
}
});

/* 탭 전환 */
document.querySelectorAll('.tab').forEach(btn => {
btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});
document.getElementById('goToReviewTab').addEventListener('click', () => switchTab('review'));

function switchTab(tab){
document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === `panel-${tab}`));
}

/* 별점 선택 */
const starPicker = document.getElementById('starPicker');
starPicker.addEventListener('click', (e) => {
const target = e.target.closest('span');
if(!target) return;
selectedStars = parseInt(target.dataset.v, 10);
[...starPicker.children].forEach(s => s.classList.toggle('on', parseInt(s.dataset.v,10) <= selectedStars));
});

/* 태그 선택 */
document.getElementById('tagPick').addEventListener('click', (e) => {
const chip = e.target.closest('.chip');
if(!chip) return;
const tag = chip.dataset.tag;
if(selectedTags.has(tag)){ selectedTags.delete(tag); chip.classList.remove('selected'); }
else { selectedTags.add(tag); chip.classList.add('selected'); }
});

/* 리뷰 등록 */
document.getElementById('submitBtn').addEventListener('click', async () => {
const nameInput = document.getElementById('inputName');
const textInput = document.getElementById('inputText');
const name = nameInput.value.trim() || "익명****";
const text = textInput.value.trim();

if(!text){
textInput.focus();
textInput.style.borderColor = '#ff5c5c';
setTimeout(() => textInput.style.borderColor = '', 900);
return;
}
const rating = selectedStars || 5;
const tags = selectedTags.size ? [...selectedTags] : ["🙂 방문 인증"];

const today = new Date();
const dateLabel = `${today.getMonth()+1}.${today.getDate()} 방금 등록`;

const newReview = { name, meta: "새 리뷰", rating, visit: "🆕 방금 남긴 리뷰", text, tags, dateLabel };

const btn = document.getElementById('submitBtn');
btn.disabled = true; btn.textContent = "등록 중...";

try{
if(usingFirebase && window.__firebase.addReview){
// 응답이 10초 안에 오지 않으면 실패로 간주하고 버튼을 풀어줍니다.
const timeout = new Promise((_, reject) =>
setTimeout(() => reject(new Error("요청 시간 초과 (10초)")), 10000)
);
await Promise.race([window.__firebase.addReview(newReview), timeout]);
// onSnapshot 구독이 자동으로 목록을 갱신함 (Firestore에 영구 저장됨)
} else {
// Firebase 미연결 시: 브라우저를 새로고침하면 사라지는 임시 저장
reviews = [newReview, ...reviews];
renderReviews();
}
} catch(err){
console.error("리뷰 등록 오류:", err);
alert("리뷰 등록에 실패했어요.\n(" + err.message + ")\n네트워크 연결이나 광고 차단 확장 프로그램, Firestore 보안 규칙을 확인해주세요.");
} finally {
nameInput.value = "";
textInput.value = "";
selectedStars = 0;
selectedTags.clear();
[...starPicker.children].forEach(s => s.classList.remove('on'));
[...document.getElementById('tagPick').children].forEach(c => c.classList.remove('selected'));
btn.disabled = false; btn.textContent = "등록하기";
}
});

/* 전화 버튼 -> 유튜브(또는 지정한 링크)로 이동 */
document.getElementById('callPill').addEventListener('click', () => {
window.open(STORE.callButtonLink, '_blank');
});

/* 도착 버튼 -> 커플 디데이 모달 표시 */
const ddayModal = document.getElementById('ddayModal');

function renderDday(){
// 날짜만 비교하도록 자정 기준으로 계산 (시간대 영향 최소화)
const [y, m, d] = STORE.coupleStartDate.split('-').map(Number);
const start = new Date(y, m - 1, d);
const now = new Date();
const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

const diffDays = Math.round((today - start) / (1000 * 60 * 60 * 24));
const dayCount = diffDays + 1; // 시작일을 1일차로 계산

const startLabel = `${y}.${String(m).padStart(2,'0')}.${String(d).padStart(2,'0')}`;

if(diffDays < 0){
document.getElementById('ddayCount').textContent = `D-${Math.abs(diffDays)}`;
document.getElementById('ddaySince').textContent = `${startLabel}까지 남은 날`;
} else {
document.getElementById('ddayCount').textContent = `D+${dayCount}`;
document.getElementById('ddaySince').textContent = `${startLabel}부터 함께한 날`;
}
}

document.getElementById('arrivalPill').addEventListener('click', () => {
renderDday();
ddayModal.classList.add('open');
});
document.getElementById('ddayModalClose').addEventListener('click', () => {
ddayModal.classList.remove('open');
});
ddayModal.addEventListener('click', (e) => {
if(e.target === ddayModal) ddayModal.classList.remove('open');
});

/* 이미지 모달 (출발 / 알림받기 공용) */
const notifyModal = document.getElementById('notifyModal');
const notifyModalTitle = document.getElementById('notifyModalTitle');
const notifyImageWrap = document.getElementById('notifyImageWrap');

function openImageModal(title, imageUrl){
notifyModalTitle.textContent = title;
notifyImageWrap.innerHTML = imageUrl
? `<img src="${imageUrl}" alt="${title}">`
: `<div class="placeholder">등록된 이미지가 없어요.</div>`;
notifyModal.classList.add('open');
}

document.getElementById('departurePill').addEventListener('click', () => {
openImageModal('출발', STORE.departureImage);
});
document.getElementById('notifyPill').addEventListener('click', () => {
openImageModal('알림받기', STORE.notifyImage);
});
document.getElementById('notifyModalClose').addEventListener('click', () => {
notifyModal.classList.remove('open');
});
notifyModal.addEventListener('click', (e) => {
if(e.target === notifyModal) notifyModal.classList.remove('open');
});

/* 초기화 */
renderStaticText();
renderCarousel();
renderReviews();

/* Firebase 연결 (설정되어 있으면 실시간 구독, 아니면 로컬 메모리로만 동작) */
window.addEventListener('firebase-ready', () => {
usingFirebase = !!window.__firebase.isFirebaseConfigured;
const warn = document.getElementById('fbWarning');

if(!usingFirebase){
warn.style.display = 'block';
warn.textContent = "⚠ Firebase가 아직 연결되지 않았어요. 현재는 리뷰가 새로고침하면 사라집니다. 상단 <script type=\"module\"> 안의 FIREBASE_CONFIG 값을 채워주면 리뷰가 영구 저장됩니다.";
return;
}

window.__firebase.subscribe((list) => {
firestoreLoaded = true;
const fetched = list.map(r => ({
id: r.id,
name: r.name, meta: r.meta, rating: r.rating,
visit: r.visit, text: r.text, tags: r.tags, dateLabel: r.dateLabel
}));
// 새로 등록된 리뷰(최신순)를 위에, 처음부터 있던 예시 리뷰를 그 아래에 이어서 보여줍니다.
reviews = [...fetched, ...STORE.seedReviews];
renderReviews();
});
});
</script>
</body>
</html>
